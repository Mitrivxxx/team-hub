syntax = "proto3";

option csharp_namespace = "TeamHub.GrpcContracts.Auth.V1";

package teamhub.auth.v1;

service UserProfileService {
  rpc GetUsersByIds (GetUsersByIdsRequest) returns (GetUsersByIdsResponse);
  rpc ResolveUsers (ResolveUsersRequest) returns (ResolveUsersResponse);
}

message GetUsersByIdsRequest {
  repeated string user_ids = 1;
}

message GetUsersByIdsResponse {
  repeated UserProfile users = 1;
}

message ResolveUsersRequest {
  repeated string emails = 1;
  repeated string usernames = 2;
}

message ResolveUsersResponse {
  repeated UserProfile users = 1;
  repeated string unresolved_emails = 2;
  repeated string unresolved_usernames = 3;
}

message UserProfile {
  string id = 1;
  string username = 2;
  string name = 3;
  string surname = 4;
  string email = 5;
}
