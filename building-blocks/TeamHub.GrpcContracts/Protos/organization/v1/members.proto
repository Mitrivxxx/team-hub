syntax = "proto3";

option csharp_namespace = "TeamHub.GrpcContracts.Organization.V1";

package teamhub.organization.v1;

service OrganizationMemberService {
  rpc ListMembers (ListMembersRequest) returns (ListMembersResponse);
  rpc ListActivity (ListActivityRequest) returns (ListActivityResponse);
}

message ListMembersRequest {
  string organization_id = 1;
  string actor_user_id = 2;
  optional string role_id = 3;
  optional string team_id = 4;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message Member {
  string user_id = 1;
  repeated Role roles = 2;
  string joined_at = 3;
  repeated string team_ids = 4;
}

message Role {
  string id = 1;
  string name = 2;
  string scope = 3;
  bool is_system = 4;
}

message ListActivityRequest {
  string organization_id = 1;
  string actor_user_id = 2;
  optional string type = 3;
  optional string q = 4;
  optional string from = 5;
  optional string to = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message ListActivityResponse {
  repeated ActivityItem items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}

message ActivityItem {
  string id = 1;
  string type = 2;
  optional string actor_user_id = 3;
  optional string target_user_id = 4;
  optional string entity_type = 5;
  optional string entity_id = 6;
  optional string details = 7;
  string occurred_at = 8;
}
