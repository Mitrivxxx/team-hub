syntax = "proto3";

option csharp_namespace = "TeamHub.GrpcContracts.Organization.V1";

package teamhub.organization.v1;

service OrganizationMemberService {
  rpc ListMembers (ListMembersRequest) returns (ListMembersResponse);
}

message ListMembersRequest {
  string organization_id = 1;
  string actor_user_id = 2;
  optional string role_id = 3;
  optional string team_id = 4;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message Member {
  string user_id = 1;
  repeated Role roles = 2;
  string joined_at = 3;
  repeated string team_ids = 4;
}

message Role {
  string id = 1;
  string name = 2;
  string scope = 3;
  bool is_system = 4;
}
