name: team-hub-dev

include:
  - path: infrastructure/redis/docker-compose.redis.yml
    env_file:
      - infrastructure/redis/compose.dev.env
  - path: infrastructure/monitoring/docker-compose.monitoring.yml
    env_file:
      - infrastructure/monitoring/compose.dev.env

services:
  postgres:
    image: postgres:16
    container_name: team-hub-dev
    environment:
      POSTGRES_USER: matsma
      POSTGRES_DB: auth
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matsma -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
