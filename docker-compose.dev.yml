name: team-hub-dev

services:
  redis:
    image: redis:7-alpine
    container_name: team-hub-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: team-hub-dev
    environment:
      POSTGRES_USER: matsma
      POSTGRES_DB: auth
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matsma -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
