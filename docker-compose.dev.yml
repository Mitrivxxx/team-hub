# Dev companion overrides for Aspire — monitoring only.
# Merged with infrastructure/monitoring/docker-compose.monitoring.yml via compose-dev.sh.
# Paths below are relative to infrastructure/monitoring/ (first -f file directory).
# Aspire AppHost starts Postgres, Redis, Kafka, Azurite, apps, nginx, and UI.
# Usage: ./scripts/compose-dev.sh up -d
# Metrics scrape Aspire host ports via host.docker.internal (prometheus.dev.yml).

name: team-hub-dev

services:
  mon-prometheus:
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mon-nginx-exporter:
    command:
      - --nginx.scrape-uri=http://host.docker.internal:8081/nginx_status
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mon-otel:
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./.nginx-edge-logs:/var/log/nginx-edge:ro
