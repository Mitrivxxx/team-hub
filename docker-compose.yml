name: team-hub

include:
  - path: infrastructure/redis/docker-compose.redis.yml
    env_file:
      - infrastructure/redis/compose.prod.env
  - path: infrastructure/monitoring/docker-compose.monitoring.yml
    env_file:
      - infrastructure/monitoring/compose.prod.env

services:
  postgres:
    image: postgres:16
    container_name: team-hub
    environment:
      POSTGRES_USER: matsma
      POSTGRES_DB: authdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matsma -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/team-hub-auth/Dockerfile
    container_name: team-hub-auth-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    env_file:
      - ./services/team-hub-auth/team-hub-auth/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__ConnectionString: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Observability__OtlpEndpoint: http://otel-collector:4317
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: services/team-hub-gateway/Dockerfile
    container_name: team-hub-gateway-prod
    depends_on:
      auth:
        condition: service_healthy
      otel-collector:
        condition: service_started
    env_file:
      - ./services/team-hub-gateway/team-hub-gateway/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Observability__OtlpEndpoint: http://otel-collector:4317
    ports:
      - "5000:8080"

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: team-hub-nginx-prod
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "8080:443"
    volumes:
      - ./certs:/etc/nginx/certs

  web:
    build:
      context: .
      dockerfile: frontend/team-hub-web/Dockerfile
    container_name: team-hub-web-prod
    depends_on:
      - gateway
      - nginx
    ports:
      - "4200:4200"
    volumes:
      - ./certs:/etc/nginx/certs

volumes:
  postgres_data_prod:
