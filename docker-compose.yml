# Team Hub — shared Compose base (infra + apps).
# Staging: docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env.staging up --build
# Dev monitoring only: ./scripts/compose-dev.sh (Aspire runs the rest).

include:
  - path: infrastructure/postgres/docker-compose.postgres.yml
  - path: infrastructure/redis/docker-compose.redis.yml
  - path: infrastructure/kafka/docker-compose.kafka.yml
  - path: infrastructure/azurite/docker-compose.azurite.yml
  - path: infrastructure/monitoring/docker-compose.monitoring.yml

services:
  # === BACKEND SERVICES ===
  srv-auth:
    build:
      context: .
      dockerfile: services/team-hub-auth/Dockerfile
    container_name: ${AUTH_CONTAINER_NAME}
    depends_on:
      db-postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      blob-storage:
        condition: service_healthy
      mon-otel:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      ConnectionStrings__DefaultConnection: Host=db-postgres;Port=5432;Database=authdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: cache-redis:6379
      BlobStorage__ConnectionString: ${BlobStorage__ConnectionString}
      BlobStorage__ContainerName: ${BlobStorage__ContainerName:-avatars}
      BlobStorage__PublicBlobEndpoint: ${BlobStorage__PublicBlobEndpoint}
      BlobStorage__SasExpiryMinutes: ${BlobStorage__SasExpiryMinutes:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5001:8080"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

  srv-organization:
    build:
      context: .
      dockerfile: services/team-hub-organization/Dockerfile
    container_name: ${ORG_CONTAINER_NAME}
    depends_on:
      db-postgres:
        condition: service_healthy
      msg-kafka:
        condition: service_healthy
      blob-storage:
        condition: service_healthy
      mon-otel:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      ConnectionStrings__DefaultConnection: Host=db-postgres;Port=5432;Database=organizationdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: msg-kafka:9092
      Kafka__ClientId: srv-organization
      BlobStorage__ConnectionString: ${BlobStorage__ConnectionString}
      BlobStorage__ContainerName: ${BlobStorage__ContainerName:-avatars}
      BlobStorage__PublicBlobEndpoint: ${BlobStorage__PublicBlobEndpoint}
      BlobStorage__SasExpiryMinutes: ${BlobStorage__SasExpiryMinutes:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5002:8080"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 45s

  srv-notification:
    build:
      context: .
      dockerfile: services/team-hub-notification/Dockerfile
    container_name: ${NOTIFICATION_CONTAINER_NAME}
    depends_on:
      db-postgres:
        condition: service_healthy
      msg-kafka:
        condition: service_healthy
      mon-otel:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      ConnectionStrings__DefaultConnection: Host=db-postgres;Port=5432;Database=notificationdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: msg-kafka:9092
      Kafka__ClientId: srv-notification
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5004:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 30s

  srv-chat:
    build:
      context: .
      dockerfile: services/team-hub-chat/Dockerfile
    container_name: ${CHAT_CONTAINER_NAME}
    depends_on:
      db-postgres:
        condition: service_healthy
      blob-storage:
        condition: service_healthy
      mon-otel:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      ConnectionStrings__DefaultConnection: Host=db-postgres;Port=5432;Database=chatdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      BlobStorage__ConnectionString: ${BlobStorage__ConnectionString}
      BlobStorage__ContainerName: ${BlobStorage__ContainerName:-avatars}
      BlobStorage__PublicBlobEndpoint: ${BlobStorage__PublicBlobEndpoint}
      BlobStorage__SasExpiryMinutes: ${BlobStorage__SasExpiryMinutes:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5005:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 45s

  srv-bff:
    build:
      context: .
      dockerfile: services/team-hub-bff/Dockerfile
    container_name: ${BFF_CONTAINER_NAME}
    depends_on:
      srv-auth:
        condition: service_healthy
      srv-organization:
        condition: service_healthy
      mon-otel:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
      Grpc__Auth: http://srv-auth:8081
      Grpc__Organization: http://srv-organization:8081
    ports:
      - "5003:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

  # === GATEWAYS / PROXY ===
  gw-api:
    build:
      context: .
      dockerfile: services/team-hub-gateway/Dockerfile
    container_name: ${GATEWAY_CONTAINER_NAME}
    depends_on:
      srv-auth:
        condition: service_healthy
      srv-organization:
        condition: service_healthy
      srv-notification:
        condition: service_healthy
      srv-chat:
        condition: service_healthy
      srv-bff:
        condition: service_healthy
      mon-otel:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

  gw-nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: ${NGINX_CONTAINER_NAME}
    depends_on:
      gw-api:
        condition: service_healthy
    ports:
      - "8080:443"
    volumes:
      - ./certs:/etc/nginx/certs
      - nginx_edge_logs:/var/log/nginx-edge

  # === FRONTEND ===
  ui-web:
    build:
      context: .
      dockerfile: frontend/team-hub-web/Dockerfile
    container_name: ${WEB_CONTAINER_NAME}
    depends_on:
      - gw-api
      - gw-nginx
    ports:
      - "4200:4200"
    volumes:
      - ./certs:/etc/nginx/certs
