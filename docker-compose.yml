name: team-hub

include:
  - path: infrastructure/redis/docker-compose.redis.yml
    env_file:
      - infrastructure/redis/compose.prod.env
  - path: infrastructure/kafka/docker-compose.kafka.yml
    env_file:
      - infrastructure/kafka/compose.prod.env
  - path: infrastructure/monitoring/docker-compose.monitoring.yml
    env_file:
      - infrastructure/monitoring/compose.prod.env

services:
  # === DATABASES AND CACHE ===
  db-postgres:
    image: postgres:16
    container_name: db-postgres-prod
    environment:
      POSTGRES_USER: matsma
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/01-create-dbs-prod.sql:/docker-entrypoint-initdb.d/01-create-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matsma"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === BACKEND SERVICES ===
  srv-auth:
    build:
      context: .
      dockerfile: services/team-hub-auth/Dockerfile
    container_name: srv-auth-prod
    depends_on:
      db-postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      mon-otel:
        condition: service_started
    env_file:
      - ./services/team-hub-auth/team-hub-auth/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__ConnectionString: cache-redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5001:8080"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

  srv-organization:
    build:
      context: .
      dockerfile: services/team-hub-organization/Dockerfile
    container_name: srv-organization-prod
    depends_on:
      db-postgres:
        condition: service_healthy
      mon-otel:
        condition: service_started
    env_file:
      - ./services/team-hub-organization/team-hub-organization/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5002:8080"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 45s

  srv-bff:
    build:
      context: .
      dockerfile: services/team-hub-bff/Dockerfile
    container_name: srv-bff-prod
    depends_on:
      srv-auth:
        condition: service_healthy
      srv-organization:
        condition: service_healthy
      mon-otel:
        condition: service_started
    env_file:
      - ./services/team-hub-bff/team-hub-bff/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
      Grpc__Auth: http://srv-auth:8081
      Grpc__Organization: http://srv-organization:8081
    ports:
      - "5003:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

  # === GATEWAYS / PROXY ===
  gw-api:
    build:
      context: .
      dockerfile: services/team-hub-gateway/Dockerfile
    container_name: gw-api-prod
    depends_on:
      srv-auth:
        condition: service_healthy
      srv-organization:
        condition: service_healthy
      srv-bff:
        condition: service_healthy
      mon-otel:
        condition: service_started
    env_file:
      - ./services/team-hub-gateway/team-hub-gateway/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mon-otel:4317
      Observability__OtlpEndpoint: http://mon-otel:4317
    ports:
      - "5000:8080"

  gw-nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: gw-nginx-prod
    depends_on:
      gw-api:
        condition: service_started
    ports:
      - "8080:443"
    volumes:
      - ./certs:/etc/nginx/certs

  # === FRONTEND ===
  ui-web:
    build:
      context: .
      dockerfile: frontend/team-hub-web/Dockerfile
    container_name: ui-web-prod
    depends_on:
      - gw-api
      - gw-nginx
    ports:
      - "4200:4200"
    volumes:
      - ./certs:/etc/nginx/certs

volumes:
  postgres_data_prod:
