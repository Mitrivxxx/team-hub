services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: ${AZURITE_CONTAINER_NAME}
    command: azurite --blobHost 0.0.0.0 --location /data --debug /data/debug.log
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite_data_dev:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:10000/devstoreaccount1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  azurite_data_dev:
