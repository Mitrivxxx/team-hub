# Edge-generated errors only (proxy_intercept_errors stays off).
error_page 413 = @error_413;
error_page 429 = @error_429;
error_page 502 = @error_502;
error_page 504 = @error_504;

location @error_413 {
    internal;
    default_type application/json;
    add_header X-Correlation-ID $corr_id always;
    return 413 '{"type":"about:blank","title":"Payload Too Large","status":413}';
}

location @error_429 {
    internal;
    default_type application/json;
    add_header X-Correlation-ID $corr_id always;
    add_header Retry-After 60 always;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429}';
}

location @error_502 {
    internal;
    default_type application/json;
    add_header X-Correlation-ID $corr_id always;
    return 502 '{"type":"about:blank","title":"Bad Gateway","status":502}';
}

location @error_504 {
    internal;
    default_type application/json;
    add_header X-Correlation-ID $corr_id always;
    return 504 '{"type":"about:blank","title":"Gateway Timeout","status":504}';
}
