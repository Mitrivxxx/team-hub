location /health {
    proxy_pass http://gw-api/health;
    include /etc/nginx/snippets/team-hub/proxy_params.conf;
}

location ~* ^/api/organizations/.+/invitations/by-token/.+/accept$ {
    limit_req zone=invite_accept_limit burst=5 nodelay;
    proxy_pass http://gw-api;
    include /etc/nginx/snippets/team-hub/proxy_params.conf;
}

location ~* ^/api/organizations/.+/invitations {
    limit_req zone=invite_limit burst=3 nodelay;
    proxy_pass http://gw-api;
    include /etc/nginx/snippets/team-hub/proxy_params.conf;
}

location ~* ^/api/organizations/.+/imports {
    limit_req zone=import_limit burst=2 nodelay;
    proxy_pass http://gw-api;
    include /etc/nginx/snippets/team-hub/proxy_params.conf;
}

location ~* ^/api/organizations/.+/avatar$ {
    limit_req zone=avatar_limit burst=5 nodelay;
    proxy_pass http://gw-api;
    include /etc/nginx/snippets/team-hub/proxy_params.conf;
}

location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://gw-api;
    include /etc/nginx/snippets/team-hub/proxy_params.conf;
}
