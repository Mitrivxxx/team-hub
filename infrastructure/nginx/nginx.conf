map $http_x_correlation_id $corr_id {
    ""      $request_id;
    default $http_x_correlation_id;
}

log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"service_name":"gw-nginx",'
        '"request_id":"$request_id",'
        '"CorrelationId":"$corr_id",'
        '"TraceId":"$upstream_http_x_correlation_id",'
        '"SessionId":"$http_x_session_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent",'
        '"host":"$host"'
    '}';

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=invite_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=invite_accept_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=import_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=avatar_limit:10m rate=10r/m;

limit_req_status 429;

error_log /var/log/nginx-edge/error.log warn;
error_log /dev/stderr warn;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;
    access_log /var/log/nginx-edge/access.log json_combined;

    include /etc/nginx/snippets/team-hub/api_locations.conf;
    include /etc/nginx/snippets/team-hub/error_pages.conf;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    client_max_body_size 10m;
    access_log /var/log/nginx-edge/access.log json_combined;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/team-hub/api_locations.conf;
    include /etc/nginx/snippets/team-hub/error_pages.conf;
}

# Internal metrics only (not published to host).
server {
    listen 8081;
    server_name localhost;

    access_log off;

    location /nginx_status {
        stub_status;
    }
}
