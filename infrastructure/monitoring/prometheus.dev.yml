# Prometheus scrape config for Aspire companion (compose-dev).
# App processes listen on the host; reach them via host.docker.internal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: srv-auth
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5001"]
        labels:
          service_name: team-hub-auth

  - job_name: srv-organization
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5002"]
        labels:
          service_name: team-hub-organization

  - job_name: srv-notification
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5004"]
        labels:
          service_name: team-hub-notification

  - job_name: srv-chat
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5005"]
        labels:
          service_name: team-hub-chat

  - job_name: srv-bff
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5003"]
        labels:
          service_name: team-hub-bff

  - job_name: gw-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]
        labels:
          service_name: team-hub-gateway

  - job_name: gw-nginx
    static_configs:
      - targets: ["mon-nginx-exporter:9113"]
        labels:
          service_name: gw-nginx
